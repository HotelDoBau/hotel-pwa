<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos - Hotel do Baú</title>
    <link rel="stylesheet" href="css/pedidos.css">

    <style>
        .barra-pedidos {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .status-origens {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 12px 0 24px;
        }

        .status-origem {
            background: #fff;
            padding: 8px 12px;
            border-radius: 999px;
            box-shadow: 0 3px 10px rgba(0,0,0,.08);
            font-size: 14px;
        }

        .tipo-pedido {
            display: inline-block;
            padding: 6px 11px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .tipo-hospede {
            background: #e8f4ff;
            color: #245d88;
        }

        .tipo-garcom {
            background: #fff3d6;
            color: #8b6b00;
        }

        .pedido-card {
            background: #fff;
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 22px;
            box-shadow: 0 7px 20px rgba(0,0,0,.09);
        }

        .pedido-topo {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            align-items: flex-start;
        }

        .pedido-topo h2 {
            margin: 0 0 8px;
        }

        .identificacao {
            font-size: 18px;
            margin: 4px 0;
        }

        .data-hora {
            color: #666;
        }

        .acoes-pedido {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        .botao.finalizar {
            background: #eee;
            color: #222;
        }

        .sem-preco .item {
            justify-content: flex-start;
        }

        @media (max-width: 650px) {
            .pedido-topo {
                flex-direction: column;
            }

            .acoes-pedido {
                flex-direction: column;
            }

            .acoes-pedido .botao {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header class="topo">
    <button onclick="history.back()" class="voltar">← Voltar</button>

    <div class="titulo">
        <h1>🧾 Pedidos Recebidos</h1>
        <p>Área da Recepção / Produção</p>
    </div>
</header>

<main class="container">

    <div class="barra-pedidos">
        <span id="contador-pedidos">0 pedidos pendentes</span>

        <button id="btn-notificacao" class="botao atualizar">
            🔔 Ativar notificações
        </button>
    </div>

    <div class="status-origens">
        <span id="status-hospedes" class="status-origem">🟡 Hóspedes conectando...</span>
        <span id="status-garcom" class="status-origem">🟡 Garçons conectando...</span>
    </div>

    <section id="lista-pedidos">
        <div class="sem-pedido">
            <h2>⏳ Carregando...</h2>
            <p>Buscando pedidos dos dois sistemas.</p>
        </div>
    </section>

</main>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    onSnapshot,
    deleteDoc,
    doc
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// =====================================================
// FIREBASE ANTIGO - HOTEL PWA / HÓSPEDES
// =====================================================

const firebaseConfigHospedes = {
    apiKey: "AIzaSyBFh1CIN7upch4eXlglUaC_F9rvhpD87gg",
    authDomain: "hotel-do-bau.firebaseapp.com",
    projectId: "hotel-do-bau",
    storageBucket: "hotel-do-bau.firebasestorage.app",
    messagingSenderId: "139452222353",
    appId: "1:139452222353:web:28c69b7a802ec4aa4c2830"
};


// =====================================================
// FIREBASE NOVO - HOTEL GARCOM
// =====================================================

const firebaseConfigGarcom = {
    apiKey: "AIzaSyDaj28MSSHMKfsofE27DfKcsdCD2MUngGA",
    authDomain: "hotel-garcom.firebaseapp.com",
    projectId: "hotel-garcom",
    storageBucket: "hotel-garcom.firebasestorage.app",
    messagingSenderId: "357749341622",
    appId: "1:357749341622:web:b5ff6267d5be911d681517"
};


// =====================================================
// INICIA OS DOIS PROJETOS
// =====================================================

const appHospedes = initializeApp(firebaseConfigHospedes, "hotelHospedes");
const appGarcom = initializeApp(firebaseConfigGarcom, "hotelGarcom");

const dbHospedes = getFirestore(appHospedes);
const dbGarcom = getFirestore(appGarcom);


// =====================================================
// ESTADO
// =====================================================

let pedidosHospedes = [];
let pedidosGarcom = [];
let primeiraLeituraHospedes = true;
let primeiraLeituraGarcom = true;

// Impressão automática: somente pedidos que chegarem depois que a Central abrir.
const impressoesAutomaticasEmAndamento = new Set();


// =====================================================
// UTILIDADES
// =====================================================

function dinheiro(valor) {
    return Number(valor || 0).toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
    });
}

function escaparHTML(texto) {
    const div = document.createElement("div");
    div.textContent = texto ?? "";
    return div.innerHTML;
}

function obterTempo(pedido) {
    if (pedido.criadoEm?.seconds) {
        return pedido.criadoEm.seconds;
    }

    if (pedido.dataHora) {
        // dataHora do garçom está em pt-BR; criadoEm será preferido quando existir.
        const data = new Date(pedido.dataHora);
        if (!Number.isNaN(data.getTime())) {
            return Math.floor(data.getTime() / 1000);
        }
    }

    return 0;
}


// =====================================================
// NOTIFICAÇÕES
// =====================================================

async function ativarNotificacoes() {
    if (!("Notification" in window)) {
        alert("Este navegador não oferece suporte às notificações.");
        return;
    }

    try {
        const permissao = await Notification.requestPermission();

        if (permissao === "granted") {
            document.getElementById("btn-notificacao").textContent =
                "🔔 Notificações ativadas";

            alert("✅ Notificações ativadas!");

            new Notification("Hotel do Baú", {
                body: "✅ Avisos de novos pedidos ativados."
            });
        } else if (permissao === "denied") {
            alert("❌ As notificações estão bloqueadas no navegador.");
        } else {
            alert("A permissão para notificações não foi concedida.");
        }
    } catch (erro) {
        console.error("Erro nas notificações:", erro);
        alert("Não foi possível ativar as notificações.");
    }
}

function tocarSomNovoPedido() {
    try {
        const AudioContexto = window.AudioContext || window.webkitAudioContext;
        if (!AudioContexto) return;

        const audioContext = new AudioContexto();
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.frequency.value = 880;
        gain.gain.value = 0.25;
        oscillator.start();

        setTimeout(() => {
            oscillator.stop();
            audioContext.close();
        }, 500);
    } catch (erro) {
        console.log("Som bloqueado pelo navegador.", erro);
    }
}

function avisarNovoPedido(pedido, origem) {
    tocarSomNovoPedido();

    if (
        "Notification" in window &&
        Notification.permission === "granted"
    ) {
        const corpo = origem === "hospede"
            ? `Quarto ${pedido.quarto || "-"} • ${dinheiro(pedido.total)}`
            : `Mesa ${String(pedido.mesa || "").padStart(2, "0")} • Novo pedido`;

        const notificacao = new Notification(
            origem === "hospede"
                ? "🛎️ Novo pedido de hóspede"
                : "🍽️ Novo pedido de garçom",
            { body: corpo }
        );

        notificacao.onclick = () => {
            window.focus();
            notificacao.close();
        };
    }
}


// =====================================================
// IMPRESSÃO AUTOMÁTICA
// =====================================================

function imprimirPedidoAutomaticamente(pedido, origem) {
    if (!pedido?.id) return;

    const chave = `${origem}:${pedido.id}`;

    // Evita disparar duas vezes enquanto o mesmo pedido está sendo processado.
    if (impressoesAutomaticasEmAndamento.has(chave)) return;

    impressoesAutomaticasEmAndamento.add(chave);

    try {
        if (origem === "hospede") {
            imprimirHospede(pedido, true);
        } else {
            imprimirGarcom(pedido, true);
        }
    } catch (erro) {
        impressoesAutomaticasEmAndamento.delete(chave);
        console.error("Erro na impressão automática:", erro);
    }
}


// =====================================================
// TELA
// =====================================================

function atualizarTela() {
    const lista = document.getElementById("lista-pedidos");
    const contador = document.getElementById("contador-pedidos");

    const todos = [
        ...pedidosHospedes.map(p => ({ ...p, origem: "hospede" })),
        ...pedidosGarcom.map(p => ({ ...p, origem: "garcom" }))
    ];

    todos.sort((a, b) => obterTempo(b) - obterTempo(a));

    contador.textContent = todos.length === 1
        ? "1 pedido pendente"
        : `${todos.length} pedidos pendentes`;

    lista.innerHTML = "";

    if (todos.length === 0) {
        lista.innerHTML = `
            <div class="sem-pedido">
                <h2>📭 Nenhum pedido</h2>
                <p>Nenhuma comanda pendente no momento.</p>
            </div>
        `;
        return;
    }

    todos.forEach(pedido => {
        lista.appendChild(criarCard(pedido));
    });
}

function criarCard(pedido) {
    const card = document.createElement("article");
    card.className = "pedido-card";

    const ehHospede = pedido.origem === "hospede";
    const itens = Array.isArray(pedido.itens) ? pedido.itens : [];

    let itensHTML = "";

    itens.forEach(item => {
        if (ehHospede) {
            const subtotal = Number(item.subtotal) ||
                (Number(item.preco) * Number(item.quantidade));

            itensHTML += `
                <div class="item">
                    <div class="item-esquerda">
                        <strong>
                            ${Number(item.quantidade)}x
                            ${escaparHTML(item.nome)}
                        </strong>
                        <small>${dinheiro(item.preco)} cada</small>
                    </div>
                    <strong class="subtotal">${dinheiro(subtotal)}</strong>
                </div>
            `;
        } else {
            itensHTML += `
                <div class="item">
                    <div class="item-esquerda">
                        <strong>
                            ${Number(item.quantidade)}x
                            ${escaparHTML(item.nome)}
                        </strong>
                    </div>
                </div>
            `;
        }
    });

    const tipo = ehHospede
        ? `<span class="tipo-pedido tipo-hospede">🏨 Pedido do Hóspede</span>`
        : `<span class="tipo-pedido tipo-garcom">🍽️ Pedido do Garçom</span>`;

    const identificacao = ehHospede
        ? `🚪 Quarto: <strong>${escaparHTML(pedido.quarto || "-")}</strong>`
        : `🪑 Mesa: <strong>${String(pedido.mesa || "").padStart(2, "0")}</strong>`;

    const totalHTML = ehHospede
        ? `
            <div class="linha"></div>
            <div class="total">
                <span>TOTAL</span>
                <strong>${dinheiro(pedido.total)}</strong>
            </div>
        `
        : "";

    card.innerHTML = `
        ${tipo}

        <div class="pedido-topo">
            <div>
                <h2>${ehHospede ? "🧾 Novo Pedido" : "🍽️ Pedido para Produção"}</h2>
                <p class="identificacao">${identificacao}</p>
            </div>
            <span class="status novo">🟢 Novo</span>
        </div>

        <p class="data-hora">🕒 ${escaparHTML(pedido.dataHora || "")}</p>

        <div class="linha"></div>

        <h3>🍽️ Itens</h3>
        <div class="itens ${ehHospede ? "" : "sem-preco"}">
            ${itensHTML}
        </div>

        <div class="linha"></div>

        <div class="observacao">
            <strong>📝 Observações</strong>
            <p>${escaparHTML(pedido.observacao || "Nenhuma")}</p>
        </div>

        ${totalHTML}

        <div class="acoes-pedido">
            <button
                class="botao imprimir"
                data-imprimir="${pedido.id}"
                data-origem="${pedido.origem}">
                🖨️ Imprimir
            </button>

            <button
                class="botao finalizar"
                data-finalizar="${pedido.id}"
                data-origem="${pedido.origem}">
                ✅ Finalizar
            </button>
        </div>
    `;

    return card;
}


// =====================================================
// CLIQUES
// =====================================================

document.getElementById("lista-pedidos").addEventListener("click", async event => {
    const botaoImprimir = event.target.closest("[data-imprimir]");

    if (botaoImprimir) {
        const id = botaoImprimir.dataset.imprimir;
        const origem = botaoImprimir.dataset.origem;

        const pedido = origem === "hospede"
            ? pedidosHospedes.find(p => p.id === id)
            : pedidosGarcom.find(p => p.id === id);

        if (origem === "hospede") {
            imprimirHospede(pedido);
        } else {
            imprimirGarcom(pedido);
        }

        return;
    }

    const botaoFinalizar = event.target.closest("[data-finalizar]");

    if (botaoFinalizar) {
        const id = botaoFinalizar.dataset.finalizar;
        const origem = botaoFinalizar.dataset.origem;

        const confirmar = confirm(
            origem === "hospede"
                ? "Finalizar e remover este pedido do hóspede?"
                : "Finalizar este pedido da produção? O consumo da mesa continuará salvo."
        );

        if (!confirmar) return;

        try {
            if (origem === "hospede") {
                await deleteDoc(doc(dbHospedes, "pedidos", id));
            } else {
                // Remove apenas da fila de produção.
                // O pedido acumulado em mesas/mesa_XX/pedidos NÃO é apagado.
                await deleteDoc(doc(dbGarcom, "pedidos_producao", id));
            }
        } catch (erro) {
            console.error("Erro ao finalizar pedido:", erro);
            alert("❌ Não foi possível finalizar este pedido.");
        }
    }
});


// =====================================================
// IMPRESSÃO - HÓSPEDE
// =====================================================

async function imprimirHospede(pedido, automatico = false) {

    if (!pedido) {
        alert("Pedido não encontrado.");
        return;
    }


    const itens =
        Array.isArray(pedido.itens)
            ? pedido.itens
            : [];


    let itensHTML = "";


    itens.forEach(item => {

        const subtotal =
            Number(item.subtotal) ||
            (
                Number(item.preco) *
                Number(item.quantidade)
            );


        itensHTML += `

            <div class="linha-item-impressao">

                <span>
                    ${item.quantidade}x
                    ${escaparHTML(item.nome)}
                </span>

                <span>
                    ${dinheiro(subtotal)}
                </span>

            </div>

        `;

    });


    abrirImpressao(

        `
        <h1>HOTEL DO BAÚ</h1>

        <h2>NOVO PEDIDO</h2>

        <div class="separador"></div>

        <p class="identificacao-print">
            QUARTO:
            ${escaparHTML(pedido.quarto || "-")}
        </p>

        <p class="central">
            ${escaparHTML(pedido.dataHora || "")}
        </p>

        <div class="separador"></div>

        ${itensHTML}

        <div class="separador"></div>

        <strong>
            OBSERVAÇÕES:
        </strong>

        <p class="obs">
            ${escaparHTML(
                pedido.observacao || "Nenhuma"
            )}
        </p>

        <div class="separador"></div>

        <div class="total-impressao">

            <span>TOTAL</span>

            <span>
                ${dinheiro(pedido.total)}
            </span>

        </div>

        <div class="separador"></div>

        <p class="central">
            Hotel do Baú
            <br>
            Obrigado!
        </p>
        `,

        async function () {

            const chave = `hospede:${pedido.id}`;

            try {
                // No modo automático do Brave (--kiosk-printing), não pede confirmação.
                // No botão manual, mantém a confirmação de segurança.
                if (!automatico) {
                    const confirmar = confirm(
                        "A impressão do pedido do quarto " +
                        (pedido.quarto || "-") +
                        " saiu corretamente?"
                    );

                    if (!confirmar) {
                        return;
                    }
                }

                await deleteDoc(
                    doc(
                        dbHospedes,
                        "pedidos",
                        pedido.id
                    )
                );

            }
            catch (erro) {
                console.error("Erro ao finalizar pedido:", erro);
                alert(
                    "A impressão saiu, mas não foi possível retirar o pedido da tela."
                );
            }
            finally {
                impressoesAutomaticasEmAndamento.delete(chave);
            }

        }

    );

}

// =====================================================
// IMPRESSÃO - GARÇOM / PRODUÇÃO
// =====================================================

async function imprimirGarcom(pedido, automatico = false) {

    if (!pedido) {
        alert("Pedido não encontrado.");
        return;
    }


    const itens =
        Array.isArray(pedido.itens)
            ? pedido.itens
            : [];


    let itensHTML = "";


    itens.forEach(item => {

        itensHTML += `

            <div class="item-producao">

                <strong>

                    ${item.quantidade}x

                    ${escaparHTML(
                        item.nome
                    )}

                </strong>

            </div>

        `;

    });


    abrirImpressao(

        `
        <h1>HOTEL DO BAÚ</h1>

        <h2>PRODUÇÃO</h2>

        <div class="separador"></div>

        <p class="identificacao-print mesa-print">

            MESA
            ${String(
                pedido.mesa || ""
            ).padStart(2, "0")}

        </p>

        <p class="central">

            ${escaparHTML(
                pedido.dataHora || ""
            )}

        </p>

        <div class="separador"></div>

        ${itensHTML}

        <div class="separador"></div>

        <strong>
            OBSERVAÇÃO:
        </strong>

        <p class="obs">

            ${escaparHTML(
                pedido.observacao ||
                "Nenhuma"
            )}

        </p>
        `,

        async function () {

            const chave = `garcom:${pedido.id}`;

            try {
                // No modo automático do Brave (--kiosk-printing), não pede confirmação.
                // No botão manual, mantém a confirmação de segurança.
                if (!automatico) {
                    const confirmar = confirm(
                        "A impressão da Mesa " +
                        String(pedido.mesa || "").padStart(2, "0") +
                        " saiu corretamente?"
                    );

                    if (!confirmar) {
                        return;
                    }
                }

                await deleteDoc(
                    doc(
                        dbGarcom,
                        "pedidos_producao",
                        pedido.id
                    )
                );

            }
            catch (erro) {
                console.error("Erro ao finalizar produção:", erro);
                alert(
                    "A impressão saiu, mas não foi possível retirar o pedido da fila."
                );
            }
            finally {
                impressoesAutomaticasEmAndamento.delete(chave);
            }

        }

    );

}

// =====================================================
// JANELA DE IMPRESSÃO 80MM
// =====================================================

async function abrirImpressao(
    conteudo,
    aoFinalizar
) {

    // Usa um iframe invisível em vez de window.open().
    // Isso evita o bloqueio de pop-up quando a impressão é automática.

    const iframe =
        document.createElement("iframe");

    iframe.style.position = "fixed";
    iframe.style.right = "0";
    iframe.style.bottom = "0";
    iframe.style.width = "1px";
    iframe.style.height = "1px";
    iframe.style.border = "0";
    iframe.style.opacity = "0";
    iframe.setAttribute("aria-hidden", "true");

    document.body.appendChild(iframe);


    const documento =
        iframe.contentDocument ||
        iframe.contentWindow.document;


    documento.open();

    documento.write(`

<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>
Impressão - Hotel do Baú
</title>

<style>

@page {

    size: 80mm auto;

    margin: 3mm;

}

body {

    font-family:
        Arial,
        sans-serif;

    width: 72mm;

    margin: 0 auto;

    color: #000;

    font-size: 13px;

}

h1 {

    text-align: center;

    margin: 0;

    font-size: 20px;

}

h2 {

    text-align: center;

    margin: 5px 0;

    font-size: 16px;

}

.central {

    text-align: center;

}

.separador {

    border-top:
        1px dashed #000;

    margin: 10px 0;

}

.identificacao-print {

    text-align: center;

    font-size: 20px;

    font-weight: bold;

}

.mesa-print {

    font-size: 25px;

}

.linha-item-impressao {

    display: flex;

    justify-content:
        space-between;

    gap: 10px;

    margin: 8px 0;

}

.item-producao {

    font-size: 17px;

    margin: 12px 0;

}

.obs {

    white-space:
        pre-wrap;

}

.total-impressao {

    display: flex;

    justify-content:
        space-between;

    font-size: 18px;

    font-weight: bold;

}

</style>

</head>

<body>

${conteudo}

</body>

</html>

    `);

    documento.close();


    await new Promise(
        resolve => setTimeout(resolve, 700)
    );


    try {

        iframe.contentWindow.focus();

        // No Brave iniciado com --kiosk-printing,
        // print() envia direto para a impressora selecionada.
        iframe.contentWindow.print();


        // Dá tempo para o trabalho ser enviado antes de remover o iframe.
        await new Promise(
            resolve => setTimeout(resolve, 1200)
        );


        if (typeof aoFinalizar === "function") {

            await aoFinalizar();

        }

    }

    catch (erro) {

        console.error(
            "Erro ao imprimir automaticamente:",
            erro
        );

        alert(
            "Não foi possível imprimir automaticamente."
        );

    }

    finally {

        iframe.remove();

    }

}


// =====================================================
// FIREBASE - PEDIDOS DOS HÓSPEDES
// =====================================================

onSnapshot(
    collection(dbHospedes, "pedidos"),
    snapshot => {
        if (!primeiraLeituraHospedes) {
            snapshot.docChanges().forEach(alteracao => {
                if (alteracao.type === "added") {
                    const pedidoNovo = {
                        id: alteracao.doc.id,
                        ...alteracao.doc.data()
                    };

                    avisarNovoPedido(pedidoNovo, "hospede");
                    imprimirPedidoAutomaticamente(pedidoNovo, "hospede");
                }
            });
        }

        pedidosHospedes = [];

        snapshot.forEach(documento => {
            pedidosHospedes.push({
                id: documento.id,
                ...documento.data()
            });
        });

        document.getElementById("status-hospedes").textContent =
            "🟢 Hóspedes online";

        primeiraLeituraHospedes = false;
        atualizarTela();
    },
    erro => {
        console.error("Erro hóspedes:", erro);
        document.getElementById("status-hospedes").textContent =
            "🔴 Hóspedes offline";
    }
);


// =====================================================
// FIREBASE - PEDIDOS DOS GARÇONS
// =====================================================

onSnapshot(
    collection(dbGarcom, "pedidos_producao"),
    snapshot => {
        if (!primeiraLeituraGarcom) {
            snapshot.docChanges().forEach(alteracao => {
                if (alteracao.type === "added") {
                    const pedidoNovo = {
                        id: alteracao.doc.id,
                        ...alteracao.doc.data()
                    };

                    avisarNovoPedido(pedidoNovo, "garcom");
                    imprimirPedidoAutomaticamente(pedidoNovo, "garcom");
                }
            });
        }

        pedidosGarcom = [];

        snapshot.forEach(documento => {
            pedidosGarcom.push({
                id: documento.id,
                ...documento.data()
            });
        });

        document.getElementById("status-garcom").textContent =
            "🟢 Garçons online";

        primeiraLeituraGarcom = false;
        atualizarTela();
    },
    erro => {
        console.error("Erro garçons:", erro);
        document.getElementById("status-garcom").textContent =
            "🔴 Garçons offline";
    }
);


// =====================================================
// BOTÃO DE NOTIFICAÇÃO
// =====================================================

document
    .getElementById("btn-notificacao")
    .addEventListener("click", ativarNotificacoes);

if (
    "Notification" in window &&
    Notification.permission === "granted"
) {
    document.getElementById("btn-notificacao").textContent =
        "🔔 Notificações ativadas";
}

</script>
