let pedidosHospedes = [];

const fechamentosEmAndamento =
    new Set();


const impressoesAutomaticasEmAndamento =
    new Set();

const TEMPO_TRAVA_IMPRESSAO = 30000;

function adquirirTravaImpressao(chave) {

    const agora = Date.now();

    try {

        const existente =
            localStorage.getItem(
                "hotelBau_impressao_" + chave
            );

        if (existente) {

            const tempo =
                Number(existente);

            if (
                agora - tempo <
                TEMPO_TRAVA_IMPRESSAO
            ) {

                return false;

            }

        }

        localStorage.setItem(
            "hotelBau_impressao_" + chave,
            String(agora)
        );

        return true;

    }

    catch (erro) {

        console.error(
            "Erro ao criar trava de impressão:",
            erro
        );

        return true;

    }

}


function liberarTravaImpressao(chave) {

    try {

        localStorage.removeItem(
            "hotelBau_impressao_" + chave
        );

    }

    catch (erro) {

        console.error(
            "Erro ao liberar trava:",
            erro
        );

    }

}


// =====================================================
// UTILIDADES
// =====================================================

function dinheiro(valor) {

    return Number(
        valor || 0
    ).toLocaleString(
        "pt-BR",
        {
            style: "currency",
            currency: "BRL"
        }
    );

}


function escaparHTML(texto) {

    const div =
        document.createElement("div");

    div.textContent =
        texto ?? "";

    return div.innerHTML;

}


function obterTempo(pedido) {

    if (
        pedido.criadoEm?.seconds
    ) {

        return pedido.criadoEm.seconds;

    }


    if (pedido.dataHora) {

        const data =
            new Date(
                pedido.dataHora
            );

        if (
            !Number.isNaN(
                data.getTime()
            )
        ) {

            return Math.floor(
                data.getTime() / 1000
            );

        }

    }


    return 0;

}

async function ativarNotificacoes() {

    if (
        !("Notification" in window)
    ) {

        alert(
            "Este navegador não oferece suporte às notificações."
        );

        return;

    }


    try {

        const permissao =
            await Notification.requestPermission();


        if (
            permissao === "granted"
        ) {

            document.getElementById(
                "btn-notificacao"
            ).textContent =
                "🔔 Notificações ativadas";


            alert(
                "✅ Notificações ativadas!"
            );


            new Notification(
                "Hotel do Baú",
                {
                    body:
                        "✅ Avisos de novos pedidos ativados."
                }
            );

        }

        else if (
            permissao === "denied"
        ) {

            alert(
                "❌ As notificações estão bloqueadas no navegador."
            );

        }

        else {

            alert(
                "A permissão para notificações não foi concedida."
            );

        }

    }

    catch (erro) {

        console.error(
            "Erro nas notificações:",
            erro
        );

        alert(
            "Não foi possível ativar as notificações."
        );

    }

}


function tocarSomNovoPedido() {

    try {

        const AudioContexto =
            window.AudioContext ||
            window.webkitAudioContext;


        if (!AudioContexto) {
            return;
        }


        const audioContext =
            new AudioContexto();


        const oscillator =
            audioContext.createOscillator();


        const gain =
            audioContext.createGain();


        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );


        oscillator.frequency.value =
            880;


        gain.gain.value =
            0.25;


        oscillator.start();


        setTimeout(() => {

            oscillator.stop();

            audioContext.close();

        }, 500);

    }

    catch (erro) {

        console.log(
            "Som bloqueado pelo navegador.",
            erro
        );

    }

}


function avisarNovoPedido(
    pedido,
    origem
) {

    tocarSomNovoPedido();


    if (
        "Notification" in window &&
        Notification.permission === "granted"
    ) {

        const corpo =
            origem === "hospede"

                ? `Quarto ${pedido.quarto || "-"} • ${dinheiro(pedido.total)}`

                : `Mesa ${String(
                    pedido.mesa || ""
                ).padStart(2, "0")} • Novo pedido`;


        const notificacao =
            new Notification(

                origem === "hospede"

                    ? "🛎️ Novo pedido de hóspede"

                    : "🍽️ Novo pedido de garçom",

                {
                    body: corpo
                }

            );


        notificacao.onclick = () => {

            window.focus();

            notificacao.close();

        };

    }

}


// =====================================================
// IMPRESSÃO AUTOMÁTICA
// =====================================================

async function imprimirPedidoAutomaticamente(
    pedido,
    origem
) {

    if (!pedido?.id) {
        return;
    }


    const chave =
        `${origem}:${pedido.id}`;


    // ==========================================
    // PRIMEIRA TRAVA — ESTA PÁGINA
    // ==========================================

    if (
        impressoesAutomaticasEmAndamento.has(
            chave
        )
    ) {

        return;

    }


    // ==========================================
    // SEGUNDA TRAVA — TODAS AS ABAS/JANELAS
    // ==========================================

    if (
        !adquirirTravaImpressao(chave)
    ) {

        console.log(
            "Impressão já está sendo processada:",
            chave
        );

        return;

    }


    impressoesAutomaticasEmAndamento.add(
        chave
    );


    try {

        // ==========================================
        // HÓSPEDE
        // ==========================================

        if (
            origem === "hospede"
        ) {

            try {

                await imprimirHospede(
                    pedido,
                    true
                );

            }

            catch (erro) {

                console.error(
                    "Erro ao imprimir pedido do hóspede:",
                    erro
                );

            }

            return;

        }


        // ==========================================
        // GARÇOM
        // ==========================================

        console.log(
            "Novo pedido do garçom recebido:",
            pedido
        );


        // ==========================================
        // 1º — PRODUÇÃO
        // SOMENTE OS ITENS NOVOS
        // ==========================================

        try {

            console.log(
                "Iniciando impressão da produção:",
                pedido.id
            );


            await imprimirGarcom(
                pedido,
                true
            );


            console.log(
                "Produção enviada para impressão:",
                pedido.id
            );

        }

        catch (erroProducao) {

            console.error(
                "Erro na impressão da produção:",
                erroProducao
            );

        }


        // ==========================================
        // 2º — CONSUMO ACUMULADO
        // TODOS OS PEDIDOS DA MESA
        // ==========================================

        try {

            console.log(
                "Iniciando impressão do consumo acumulado:",
                pedido
            );


            await imprimirConsumoMesa(
                pedido,
                true
            );


            console.log(
                "Consumo enviado para impressão:",
                pedido.id
            );

        }

        catch (erroConsumo) {

            console.error(
                "Erro na impressão do consumo:",
                erroConsumo
            );

        }

    }

    finally {

        impressoesAutomaticasEmAndamento.delete(
            chave
        );


        liberarTravaImpressao(
            chave
        );

    }

}
// =====================================================
// JANELA DE IMPRESSÃO 80MM
// =====================================================

async function abrirImpressao(
    conteudo,
    aoFinalizar
) {

    // Iframe invisível.
    // Evita bloqueio de pop-up na impressão automática.

    const iframe =
        document.createElement(
            "iframe"
        );


    iframe.style.position =
        "fixed";


    iframe.style.right =
        "0";


    iframe.style.bottom =
        "0";


    iframe.style.width =
        "1px";


    iframe.style.height =
        "1px";


    iframe.style.border =
        "0";


    iframe.style.opacity =
        "0";


    iframe.setAttribute(
        "aria-hidden",
        "true"
    );


    document.body.appendChild(
        iframe
    );


    const documento =
        iframe.contentDocument ||
        iframe.contentWindow.document;


    documento.open();


    documento.write(`

<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">


<title>
Impressão - Hotel do Baú
</title>


<style>

@page {

    size: 80mm auto;

    margin: 3mm;

}


body {

    font-family:
        Arial,
        sans-serif;

    width: 72mm;

    margin: 0 auto;

    color: #000;

    font-size: 13px;

}


h1 {

    text-align: center;

    margin: 0;

    font-size: 20px;

}


h2 {

    text-align: center;

    margin: 5px 0;

    font-size: 16px;

}


.central {

    text-align: center;

}


.separador {

    border-top:
        1px dashed #000;

    margin: 10px 0;

}


.identificacao-print {

    text-align: center;

    font-size: 20px;

    font-weight: bold;

}


.mesa-print {

    font-size: 25px;

}


.linha-item-impressao {

    display: flex;

    justify-content:
        space-between;

    gap: 10px;

    margin: 8px 0;

}


.item-producao {

    font-size: 17px;

    margin: 12px 0;

}


.obs {

    white-space:
        pre-wrap;

}


.total-impressao {

    display: flex;

    justify-content:
        space-between;

    font-size: 18px;

    font-weight: bold;

}

</style>

</head>

<body>

${conteudo}

</body>

</html>


`);


documento.close();


await new Promise(
    resolve =>
        setTimeout(
            resolve,
            700
        )
);


try {

    iframe.contentWindow.focus();


    // Brave com --kiosk-printing:
    // envia diretamente para a impressora.

    iframe.contentWindow.print();


    // Tempo para o trabalho ser enviado
    // antes de remover o iframe.

    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                1200
            )
    );


    if (
        typeof aoFinalizar ===
        "function"
    ) {

        await aoFinalizar();

    }

}

catch (erro) {

    console.error(
        "Erro ao imprimir automaticamente:",
        erro
    );


    alert(
        "Não foi possível imprimir automaticamente."
    );


    throw erro;

}

finally {

    iframe.remove();

}


}
// =====================================================
// IMPRESSÃO - PEDIDO DO GARÇOM / PRODUÇÃO
// =====================================================

async function imprimirGarcom(
    pedido,
    automatico = false
) {

    if (!pedido) {
        return;
    }

    const itens =
        Array.isArray(pedido.itens)
            ? pedido.itens
            : [];

    if (!itens.length) {
        console.warn(
            "Pedido sem itens para produção:",
            pedido
        );
        return;
    }

    const tipo =
        pedido.tipo === "quarto"
            ? "QUARTO"
            : "MESA";

    const numero =
        pedido.quarto ||
        pedido.mesa ||
        pedido.numero ||
        "-";

    let conteudo = "";

    conteudo += `
        <h1>HOTEL DO BAÚ</h1>

        <h2>PRODUÇÃO</h2>

        <div class="separador"></div>

        <div class="identificacao-print">
            ${tipo} ${String(numero).padStart(2, "0")}
        </div>

        <div class="central">
            Pedido #${pedido.numeroPedido || "-"}
        </div>

        <div class="separador"></div>
    `;

    itens.forEach(item => {

        const quantidade =
            Number(item.quantidade || 0);

        const nome =
            escaparHTML(
                item.nome || "Item"
            );

        conteudo += `
            <div class="item-producao">
                <strong>
                    ${quantidade}x
                </strong>
                ${nome}
            </div>
        `;

    });

    if (pedido.observacao) {

        conteudo += `
            <div class="separador"></div>

            <strong>OBSERVAÇÃO:</strong>

            <div class="obs">
                ${escaparHTML(
                    pedido.observacao
                )}
            </div>
        `;

    }

    conteudo += `
        <div class="separador"></div>

        <div class="central">
            ${pedido.dataHora || ""}
        </div>
    `;

    await abrirImpressao(
        conteudo
    );

    /*
     * Depois que a produção foi enviada
     * para a impressora, retiramos o pedido
     * da fila de produção.
     *
     * O histórico da mesa NÃO é apagado.
     */

    if (pedido.id) {

        try {

            await deleteDoc(
                doc(
                    dbGarcom,
                    "pedidos_producao",
                    pedido.id
                )
            );

            console.log(
                "Pedido removido da fila de produção:",
                pedido.id
            );

        }

        catch (erro) {

            console.error(
                "Erro ao remover pedido da produção:",
                erro
            );

        }

    }

}


// =====================================================
// IMPRESSÃO - CONSUMO ACUMULADO DA MESA/QUARTO
// =====================================================

async function imprimirConsumoMesa(
    pedido,
    automatico = false
) {

    if (!pedido) {
        return;
    }

    const tipo =
        pedido.tipo === "quarto"
            ? "quarto"
            : "mesa";

    const numero =
        pedido.quarto ||
        pedido.mesa ||
        pedido.numero;

    if (!numero) {

        console.error(
            "Não foi possível identificar mesa/quarto:",
            pedido
        );

        return;
    }

    const idMesa =
        `${tipo}_${String(numero).padStart(2, "0")}`;

    console.log(
        "Buscando consumo acumulado:",
        idMesa
    );

    const referenciaMesa =
        collection(
            dbGarcom,
            "mesas",
            idMesa,
            "pedidos"
        );

    const snapshot =
        await getDocs(
            referenciaMesa
        );

    if (snapshot.empty) {

        console.warn(
            "Nenhum pedido acumulado encontrado:",
            idMesa
        );

        return;
    }

    const pedidos = [];

    snapshot.forEach(
        documento => {

            pedidos.push({
                id: documento.id,
                ...documento.data()
            });

        }
    );

    /*
     * Ordena os pedidos pelo horário.
     */

    pedidos.sort(
        (a, b) =>
            obterTempo(a) -
            obterTempo(b)
    );


    /*
     * Junta todos os itens de todos
     * os pedidos da mesa.
     */

    const itensAcumulados = new Map();

    let totalGeral = 0;

    pedidos.forEach(
        pedidoMesa => {

            const itens =
                Array.isArray(
                    pedidoMesa.itens
                )
                    ? pedidoMesa.itens
                    : [];

            itens.forEach(
                item => {

                    const idItem =
                        String(
                            item.id ??
                            item.nome
                        );

                    const quantidade =
                        Number(
                            item.quantidade || 0
                        );

                    const preco =
                        Number(
                            item.preco || 0
                        );

                    if (
                        itensAcumulados.has(
                            idItem
                        )
                    ) {

                        const existente =
                            itensAcumulados.get(
                                idItem
                            );

                        existente.quantidade +=
                            quantidade;

                        existente.subtotal =
                            existente.quantidade *
                            existente.preco;

                    }

                    else {

                        itensAcumulados.set(
                            idItem,
                            {
                                nome:
                                    item.nome ||
                                    "Item",

                                preco,

                                quantidade,

                                subtotal:
                                    quantidade *
                                    preco
                            }
                        );

                    }

                }
            );

            totalGeral +=
                Number(
                    pedidoMesa.total || 0
                );

        }
    );


    const identificacao =
        tipo === "quarto"
            ? "QUARTO"
            : "MESA";


    let conteudo = "";

    conteudo += `
        <h1>HOTEL DO BAÚ</h1>

        <h2>CONSUMO ATUAL</h2>

        <div class="separador"></div>

        <div class="identificacao-print">
            ${identificacao}
            <span class="mesa-print">
                ${String(numero).padStart(2, "0")}
            </span>
        </div>

        <div class="separador"></div>
    `;


    itensAcumulados.forEach(
        item => {

            conteudo += `
                <div class="linha-item-impressao">
                    <span>
                        ${item.quantidade}x
                        ${escaparHTML(
                            item.nome
                        )}
                    </span>

                    <span>
                        ${dinheiro(
                            item.subtotal
                        )}
                    </span>
                </div>
            `;

        }
    );


    conteudo += `
        <div class="separador"></div>

        <div class="total-impressao">
            <span>TOTAL</span>
            <span>
                ${dinheiro(totalGeral)}
            </span>
        </div>

        <div class="separador"></div>

        <div class="central">
            CONTA PARCIAL
        </div>

        <div class="central">
            MESA PERMANECE ABERTA
        </div>
    `;


    await abrirImpressao(
        conteudo
    );

}

async function imprimirHospede(

    if (!pedido) {
        return;
    }

    const itens =
        Array.isArray(pedido.itens)
            ? pedido.itens
            : [];

    if (!itens.length) {

        pedido.quarto ||
        pedido.numero ||
        "-";

    let conteudo = "";

    conteudo += `

    itens.forEach(

                );

                <div class="linha-item-impressao">
                    <span>
                        ${quantidade}x
                        ${escaparHTML(
                            item.nome || "Item"
                        )}

            <div class="obs">

                    pedido.observacao

    conteudo += `
        <div class="separador"></div>

        <div class="total-impressao">
            <span>TOTAL</span>

            <span>
                ${dinheiro(
                    pedido.total

            </span>
        </div>
    `;


    await abrirImpressao(
        conteudo
    );

}


// =====================================================
// IMPRESSÃO - FECHAMENTO
// =====================================================

async function imprimirFechamento(fechamento) {

    if (!fechamento?.id) {
        return;
    }

    if (fechamentosEmAndamento.has(fechamento.id)) {
        return;
    }

    fechamentosEmAndamento.add(fechamento.id);

    try {

        // ==========================================
        // IDENTIFICAÇÃO DA MESA / QUARTO
        // ==========================================

        const tipo =
            fechamento.tipo === "quarto"
                ? "quarto"
                : "mesa";

        const numero =
            fechamento.quarto ||
            fechamento.mesa ||
            fechamento.numero ||
            "";

        const idMesa =
            fechamento.idMesa ||
            `${tipo}_${String(numero).padStart(2, "0")}`;


        // ==========================================
        // BUSCAR TODOS OS PEDIDOS DA MESA
        // ==========================================

        const referenciaPedidos =
            collection(
                dbGarcom,
                "mesas",
                idMesa,
                "pedidos"
            );

        const snapshotPedidos =
            await getDocs(
                referenciaPedidos
            );


        // ==========================================
        // JUNTAR TODOS OS ITENS
        // ==========================================

        const itensAcumulados = {};

        let totalCalculado = 0;

        snapshotPedidos.forEach(documento => {

            const pedido =
                documento.data();

            const itens =
                Array.isArray(pedido.itens)
                    ? pedido.itens
                    : [];

            itens.forEach(item => {

                const chave =
                    item.id ??
                    item.nome;

                if (!chave) {
                    return;
                }

                if (!itensAcumulados[chave]) {

                    itensAcumulados[chave] = {

                        id: item.id,

                        nome:
                            item.nome || "",

                        preco:
                            Number(item.preco || 0),

                        quantidade: 0

                    };

                }

                itensAcumulados[chave].quantidade +=
                    Number(item.quantidade || 0);

            });

            totalCalculado +=
                Number(pedido.total || 0);

        });


        const itens =
            Object.values(
                itensAcumulados
            );


        // ==========================================
        // VALORES DO FECHAMENTO
        // ==========================================

        const subtotal =
            Number(
                fechamento.subtotal ??
                totalCalculado ??
                fechamento.total ??
                0
            );

        const desconto =
            Number(
                fechamento.desconto ?? 0
            );

        const total =
            Number(
                fechamento.total ??
                (subtotal - desconto)
            );


        // ==========================================
        // GERAR NÚMERO DA COMANDA
        // ==========================================

        let numeroComanda;

        try {

            numeroComanda =
                await gerarNumeroComanda();

        }

        catch (erro) {

            console.error(
                "ERRO AO GERAR NÚMERO DA COMANDA:",
                erro
            );

            alert(
                "ERRO AO GERAR COMANDA\n\n" +
                "Código: " +
                (erro.code || "desconhecido") +
                "\n\n" +
                "Mensagem: " +
                (erro.message || erro)
            );

            return;
        }


        // ==========================================
        // ITENS PARA IMPRESSÃO
        // ==========================================

        let itensHTML = "";

        itens.forEach(item => {

            const subtotalItem =
                Number(item.preco || 0) *
                Number(item.quantidade || 0);

            itensHTML += `

                <div class="linha-item-impressao">

                    <span>
                        ${Number(item.quantidade || 0)}x
                        ${escaparHTML(item.nome || "")}
                    </span>

                    <span>
                        ${dinheiro(subtotalItem)}
                    </span>

                </div>

            `;

        });


        // ==========================================
        // IDENTIFICAÇÃO DA MESA / QUARTO
        // ==========================================

        let identificacao = "";

        if (tipo === "quarto") {

            identificacao = `

                <p class="identificacao-print">

                    QUARTO
                    ${escaparHTML(
                        String(numero)
                    )}

                </p>

            `;

        }

        else {

            identificacao = `

                <p class="identificacao-print mesa-print">

                    MESA
                    ${escaparHTML(
                        String(numero).padStart(2, "0")
                    )}

                </p>

            `;

        }


        // ==========================================
        // CONTEÚDO DA CONTA FINAL
        // ==========================================

        const conteudo = `

            <h1>
                HOTEL DO BAÚ
            </h1>

            <h2>
                COMPROVANTE DE VENDA
            </h2>


            <p class="central">

                MAR BBC HOTELARIA E TURISMO LTDA

            </p>


            <p class="central">

                Rua Nove de Julho, 177<br>

                Centro - Santa Rosa de Viterbo/SP<br>

                CNPJ: 59.143.158/0001-63

            </p>


            <div class="separador"></div>


            <p class="central">

                <strong>
                    COMANDA Nº ${numeroComanda}
                </strong>

            </p>


            <div class="separador"></div>


            ${identificacao}


            <p class="central">

                ${escaparHTML(
                    fechamento.dataHora ||
                    new Date().toLocaleString("pt-BR")
                )}

            </p>


            <div class="separador"></div>


            ${itensHTML}


            <div class="separador"></div>


            <div class="total-impressao">

                <span>
                    CONSUMO
                </span>

                <span>
                    ${dinheiro(subtotal)}
                </span>

            </div>


            ${
                desconto > 0
                    ? `

                        <div class="total-impressao">

                            <span>
                                DESCONTO
                            </span>

                            <span>
                                - ${dinheiro(desconto)}
                            </span>

                        </div>

                    `
                    : ""
            }


            <div class="separador"></div>


            <div class="total-impressao">

                <span>
                    TOTAL A PAGAR
                </span>

                <span>
                    ${dinheiro(total)}
                </span>

            </div>


            <div class="separador"></div>


            <p class="central">

                Obrigado pela preferência!

            </p>


            <p class="central">

                ESTE DOCUMENTO É UM<br>

                COMPROVANTE DE VENDA.<br>

                NÃO É DOCUMENTO FISCAL.

            </p>

        `;


        // ==========================================
        // IMPRIMIR
        // ==========================================

        await abrirImpressao(
            conteudo
        );


        // ==========================================
        // APÓS IMPRIMIR:
        // 1. LIMPAR PEDIDOS
        // 2. LIBERAR MESA/QUARTO
        // 3. REMOVER FECHAMENTO DA FILA
        // ==========================================

        try {

            // --------------------------------------
            // APAGAR PEDIDOS ACUMULADOS
            // --------------------------------------

            const exclusoes = [];

            snapshotPedidos.forEach(
                documento => {

                    exclusoes.push(

                        deleteDoc(

                            doc(
                                dbGarcom,
                                "mesas",
                                idMesa,
                                "pedidos",
                                documento.id
                            )

                        )

                    );

                }
            );


            if (exclusoes.length > 0) {

                await Promise.all(
                    exclusoes
                );

            }


            // --------------------------------------
            // LIBERAR MESA / QUARTO
            // --------------------------------------

            await setDoc(

                doc(
                    dbGarcom,
                    "mesas",
                    idMesa
                ),

                {

                    numero:
                        Number(numero),

                    tipo:
                        tipo,

                    status:
                        "livre",

                    atualizadoEm:
                        serverTimestamp()

                },

                {
                    merge: true
                }

            );


            // --------------------------------------
            // REMOVER FECHAMENTO DA FILA
            // --------------------------------------

            await deleteDoc(

                doc(
                    dbGarcom,
                    "fechamentos",
                    fechamento.id
                )

            );


            console.log(
                "Fechamento concluído com sucesso:",
                idMesa
            );

        }

        catch (erro) {

            console.error(
                "Erro ao concluir fechamento:",
                erro
            );

            alert(

                "⚠️ A conta foi impressa, " +
                "mas houve um problema ao liberar a mesa.\n\n" +

                "Código: " +
                (erro.code || "sem código") +

                "\n\n" +

                "Mensagem: " +
                (erro.message || erro)

            );

        }

    }

    catch (erro) {

        console.error(
            "Erro no fechamento:",
            erro
        );

        alert(

            "⚠️ Não foi possível concluir o fechamento.\n\n" +

            "Código: " +
            (erro.code || "sem código") +

            "\n\n" +

            "Mensagem: " +
            (erro.message || erro)

        );

    }

    finally {

        fechamentosEmAndamento.delete(
            fechamento.id
        );

    }

}

function atualizarTela() {

    const lista =
        document.getElementById(
            "lista-pedidos"
        );


    if (!lista) {
        return;
    }


    const todos = [

        ...pedidosHospedes.map(
            pedido => ({
                ...pedido,
                origem: "hospede"
            })
        ),

        ...pedidosGarcom.map(
            pedido => ({
                ...pedido,
                origem: "garcom"
            })
        )

    ];


    todos.sort(
        (a, b) =>
            obterTempo(b) -
            obterTempo(a)
    );


    document.getElementById(
        "contador-pedidos"
    ).textContent =
        `${todos.length} ${
            todos.length === 1
                ? "pedido pendente"
                : "pedidos pendentes"
        }`;


    if (!todos.length) {

        lista.innerHTML = `
            <div class="sem-pedido">

                <h2>
                    ✅ Nenhum pedido pendente
                </h2>

                <p>
                    Aguardando novos pedidos.
                </p>

            </div>
        `;

        return;

    }


    lista.innerHTML =
        todos.map(
            pedido => {

                const origem =
                    pedido.origem;

                const tipoClasse =
                    origem === "hospede"
                        ? "tipo-hospede"
                        : "tipo-garcom";

                const tipoTexto =
                    origem === "hospede"
                        ? "🛎️ HÓSPEDE"
                        : "🍽️ GARÇOM";


                const identificacao =
                    origem === "hospede"

                        ? `Quarto ${
                            pedido.quarto || "-"
                        }`

                        : `${
                            pedido.tipo === "quarto"
                                ? "Quarto"
                                : "Mesa"
                        } ${
                            pedido.quarto ||
                            pedido.mesa ||
                            pedido.numero ||
                            "-"
                        }`;


                const itens =
                    Array.isArray(
                        pedido.itens
                    )
                        ? pedido.itens
                        : [];


                return `
                    <article class="pedido-card">

                        <span class="tipo-pedido ${tipoClasse}">
                            ${tipoTexto}
                        </span>

                        <div class="pedido-topo">

                            <div>

                                <h2>
                                    Pedido #${
                                        pedido.numeroPedido ||
                                        "-"
                                    }
                                </h2>

                                <div class="identificacao">
                                    ${escaparHTML(
                                        identificacao
                                    )}
                                </div>

                                <div class="data-hora">
                                    ${
                                        pedido.dataHora ||
                                        ""
                                    }
                                </div>

                            </div>

                        </div>


                        <div class="itens-pedido">

                            ${
                                itens.map(
                                    item => `

                                        <div class="item">

                                            <span>
                                                ${
                                                    Number(
                                                        item.quantidade || 0
                                                    )
                                                }x

                                                ${
                                                    escaparHTML(
                                                        item.nome ||
                                                        "Item"
                                                    )
                                                }
                                            </span>

                                            <strong>
                                                ${
                                                    dinheiro(
                                                        item.subtotal ??
                                                        (
                                                            Number(
                                                                item.preco || 0
                                                            ) *
                                                            Number(
                                                                item.quantidade || 0
                                                            )
                                                        )
                                                    )
                                                }
                                            </strong>

                                        </div>

                                    `
                                ).join("")
                            }

                        </div>


                        ${
                            pedido.observacao
                                ? `

                                    <div class="separador"></div>

                                    <strong>
                                        Observação:
                                    </strong>

                                    <div class="obs">
                                        ${
                                            escaparHTML(
                                                pedido.observacao
                                            )
                                        }
                                    </div>

                                `
                                : ""
                        }


                        <div class="total-impressao">

                            <span>
                                TOTAL
                            </span>

                            <span>
                                ${
                                    dinheiro(
                                        pedido.total
                                    )
                                }
                            </span>

                        </div>


                        <div class="acoes-pedido">

                            ${
                                origem === "garcom"

                                    ? `

                                        <button
                                            class="botao"
                                            onclick="imprimirGarcomManual('${pedido.id}')">

                                            🖨️ Imprimir produção

                                        </button>

                                        <button
                                            class="botao"
                                            onclick="imprimirConsumoManual('${pedido.id}')">

                                            🧾 Imprimir consumo

                                        </button>

                                    `

                                    : `

                                        <button
                                            class="botao"
                                            onclick="imprimirHospedeManual('${pedido.id}')">

                                            🖨️ Imprimir

                                        </button>

                                    `
                            }

                        </div>

                    </article>
                `;

            }
        ).join("");

}

collection(

        !primeiraLeituraHospedes

                    if (
                        alteracao.type ===
                        "added"

                        const pedidoNovo = {

                            ...alteracao.doc.data()

                            pedidoNovo,
                            "hospede"
                        );


                        imprimirPedidoAutomaticamente(
                            pedidoNovo,
                            "hospede"
                        );

                }
            );

    pedidosHospedes = [];


    snapshot.forEach(
        documento => {

            pedidosHospedes.push({

                    documento.id,

                ...documento.data()

        "status-hospedes"
